<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Super Website with Login</title>
  <link rel="stylesheet" href="practice.css">
</head>
<body>

  <!-- Login Section -->
  <section id="login">
    <h2>Login</h2>
    <div class="login-form">
      <input id="login-username" type="text" placeholder="Username">
      <input id="login-password" type="password" placeholder="Password">
      <div class="error" id="login-error-message"></div>
      <button id="login-button">Login</button>
    </div>
  </section>

  <!-- Main Content (protected until login) -->
  <div id="protected-content" style="display: none">
    <header>
      <h1>Welcome to My Super Website</h1>
      <p>This is a complete website made with HTML, CSS, and JS</p>
    </header>

    <nav>
      <a href="#about">About</a>
      <a href="#portfolio">Portfolio</a>
      <a href="#contact">Contact</a>
      <a href="#comments">Comments</a>
    </nav>

    <section id="about"><h2>About</h2><p>This is about section.</p></section>
    <section id="portfolio">
      <h2>Portfolio</h2>
      <div class="slider">
        <button class="prev">❮</button>
        <div class="slider-imgs">
          <img src="https://via.placeholder.com/500x300?text=Project+1">
          <img src="https://via.placeholder.com/500x300?text=Project+2">
          <img src="https://via.placeholder.com/500x300?text=Project+3">
        </div>
        <button class="next">❯</button>
      </div>
      <div class="portfolio-grid">
        <div class="portfolio-item">Project 1</div>
        <div class="portfolio-item">Project 2</div>
        <div class="portfolio-item">Project 3</div>
        <div class="portfolio-item">Project 4</div>
      </div>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <form class="contact-form">
        <input id="contact-name" type="text" placeholder="Your Name">
        <input id="contact-email" type="email" placeholder="Your Email">
        <textarea id="contact-message" rows="5" placeholder="Your Message"></textarea>
        <button type="button" id="contact-send">Send</button>
      </form>
    </section>

    <section id="comments">
      <h2>Comments</h2>
      <ul id="comment-list"></ul>
      <input id="comment-name" type="text" placeholder="Your Name">
      <input id="comment-text" type="text" placeholder="Your Comment">
      <button type="button" id="add-comment">Add Comment</button>
    </section>

    <footer>
      <p>© 2025 My Super Website</p>
    </footer>
  </div>

  <script src="practice.js"></script>
</body>
</html>
